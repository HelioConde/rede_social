name: Rede Jovem — QA e GitHub Pages
on:
  push:
    branches: [gh-pages, modernizacao/rede-jovem-pages-2026]
  pull_request:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: rede-jovem-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Verificação TypeScript e build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - name: Instalar Chromium para Playwright
        run: npx playwright install chromium
      - name: Testes e capturas Playwright
        run: npm run test:e2e
      - name: Guardar capturas e traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rede-jovem-playwright-${{ github.run_number }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Habilitar e configurar Pages
        if: github.ref == 'refs/heads/gh-pages' && github.event_name == 'push'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Disponibilizar dist para Pages
        if: github.ref == 'refs/heads/gh-pages' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
  db-rls:
    name: Testes reais de RLS (PostgreSQL descartável)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: rede_jovem_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rede_jovem_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Validar migrações, isolamento e decisões de moderação
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: rede_jovem_test
          PGUSER: postgres
          PGPASSWORD: test-only
        run: |
          set -euo pipefail
          for file in \
            supabase/tests/pg_bootstrap.sql \
            supabase/rede_jovem_mvp.sql \
            supabase/rede_jovem_controles_pessoais.sql \
            supabase/rede_jovem_moderacao.sql \
            supabase/rede_jovem_auditoria.sql \
            supabase/tests/rls_smoke.sql
          do
            echo "Verificando $file"
            psql -X -v ON_ERROR_STOP=1 -f "$file"
          done

  deploy:
    if: github.ref == 'refs/heads/gh-pages' && github.event_name == 'push'
    needs: [qa, db-rls]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
