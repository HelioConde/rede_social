name: Rede Social - demo segura GitHub Pages
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: rede-social-pages
  cancel-in-progress: false
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar apenas arquivos estaticos permitidos
        run: |
          mkdir -p dist-pages
          cp pages/index.html pages/app.js pages/styles.css pages/favicon.svg dist-pages/
          test "$(find dist-pages -type f | wc -l)" -eq 4
          ! find dist-pages -type f | grep -E '\.(php|sql|env)$'
          node --check pages/app.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node tests/pages.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rede-social-visual-qa
          path: screenshots/
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
      - id: deploy
        uses: actions/deploy-pages@v4